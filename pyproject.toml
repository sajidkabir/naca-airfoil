[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naca-airfoil"
version = "1.1.0"
description = "NACA 4-digit airfoil generator and analyzer: coordinates, thin-airfoil and panel-method aerodynamics, export and plotting"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sajid Kabir Saji" }]
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]
keywords = ["airfoil", "naca", "aerodynamics", "aerospace", "aircraft"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/sajidkabir/naca-airfoil"
Repository = "https://github.com/sajidkabir/naca-airfoil"
Issues = "https://github.com/sajidkabir/naca-airfoil/issues"
Changelog = "https://github.com/sajidkabir/naca-airfoil/blob/main/CHANGELOG.md"

[project.scripts]
naca-airfoil = "naca_airfoil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naca_airfoil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
